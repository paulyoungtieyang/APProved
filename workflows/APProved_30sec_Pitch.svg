<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">APProved — 30-second pitch diagram</title>
  <desc id="desc">Four-step story: upload data, AI drafts the submission, expert and client sign off, ready to file. Tagline: AI does the writing, a human always signs off before anything ships.</desc>

  <rect x="0" y="0" width="1200" height="400" fill="#FFFFFF"/>

  <text x="600" y="60" font-size="22" font-weight="700" fill="#4338CA" text-anchor="middle" letter-spacing="1">FROM DATA TO CE-MARK &#8212; DAYS, NOT MONTHS</text>

  <!-- Step 1 : document icon -->
  <circle cx="180" cy="185" r="58" fill="#EEF2FF" stroke="#4338CA" stroke-width="3"/>
  <g transform="translate(180,185)">
    <rect x="-15" y="-20" width="30" height="40" rx="3" fill="none" stroke="#4338CA" stroke-width="3"/>
    <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#4338CA" stroke-width="3"/>
    <line x1="-8" y1="1" x2="8" y2="1" stroke="#4338CA" stroke-width="3"/>
    <line x1="-8" y1="10" x2="3" y2="10" stroke="#4338CA" stroke-width="3"/>
  </g>
  <text x="180" y="278" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">Upload data</text>

  <line x1="248" y1="185" x2="332" y2="185" stroke="#C7CCD6" stroke-width="3"/>
  <path d="M 322 175 L 335 185 L 322 195" stroke="#C7CCD6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 : spark / AI icon -->
  <circle cx="450" cy="185" r="58" fill="#EEF2FF" stroke="#4338CA" stroke-width="3"/>
  <path d="M 450 163 L 457 178 L 472 185 L 457 192 L 450 207 L 443 192 L 428 185 L 443 178 Z" fill="#4338CA" transform="translate(0,0)"/>
  <text x="450" y="278" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">AI drafts it</text>

  <line x1="518" y1="185" x2="602" y2="185" stroke="#C7CCD6" stroke-width="3"/>
  <path d="M 592 175 L 605 185 L 592 195" stroke="#C7CCD6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 : two people icon -->
  <circle cx="720" cy="185" r="58" fill="#ECFDF5" stroke="#047857" stroke-width="3"/>
  <g fill="#047857">
    <circle cx="706" cy="172" r="9"/>
    <path d="M 690 206 C 690 188 722 188 722 206 Z"/>
    <circle cx="734" cy="172" r="9"/>
    <path d="M 718 206 C 718 188 750 188 750 206 Z"/>
  </g>
  <text x="720" y="278" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">Expert &amp; client</text>
  <text x="720" y="302" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">sign off</text>

  <line x1="788" y1="185" x2="872" y2="185" stroke="#C7CCD6" stroke-width="3"/>
  <path d="M 862 175 L 875 185 L 862 195" stroke="#C7CCD6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4 : checkmark icon -->
  <circle cx="990" cy="185" r="58" fill="#EEF2FF" stroke="#4338CA" stroke-width="3"/>
  <path d="M 966 186 L 982 202 L 1016 166" stroke="#4338CA" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="990" y="278" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">Ready to file</text>

  <!-- Tagline -->
  <text x="600" y="355" font-size="17" fill="#6B7280" text-anchor="middle" font-style="italic">AI does the writing. A human always signs off before anything ships.</text>
</svg>
