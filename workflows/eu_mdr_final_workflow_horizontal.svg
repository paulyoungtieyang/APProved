<svg viewBox="0 0 1720 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">EU MDR CE-Mark Agentic Medical Writing Workflow — Final, Horizontal</title>
  <desc id="desc">Left-to-right version of the final workflow: intake, four screening gates, parallel drafting (with a RAG step fetching EU MDR text), an automated compliance check, an internal-expert-plus-client review loop, and a final decision that forks into two outcomes: client accepts, or client declines. Colored by who acts: client (green), agent (violet), regulatory expert (red). Each stage is tagged with whether it involves a Claude call.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1720" height="700" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="34" font-size="18" font-weight="700" fill="#1A1A1A">EU MDR CE-Mark — Agentic Medical Writing Workflow (final, after fixes 1-3 + the bug-hunt round)</text>

  <!-- Legend -->
  <circle cx="1240" cy="30" r="5" fill="#047857"/>
  <text x="1251" y="34" font-size="11" font-weight="700" fill="#047857">Client</text>
  <circle cx="1310" cy="30" r="5" fill="#6D28D9"/>
  <text x="1321" y="34" font-size="11" font-weight="700" fill="#6D28D9">Agent</text>
  <circle cx="1375" cy="30" r="5" fill="#B91C1C"/>
  <text x="1386" y="34" font-size="11" font-weight="700" fill="#B91C1C">Expert</text>
  <rect x="1445" y="21" width="86" height="17" rx="8.5" fill="#DBEAFE" stroke="#1D4ED8"/>
  <text x="1488" y="33.5" font-size="9" font-weight="700" fill="#1D4ED8" text-anchor="middle">Claude call</text>
  <rect x="1539" y="21" width="98" height="17" rx="8.5" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="1588" y="33.5" font-size="9" font-weight="700" fill="#6B7280" text-anchor="middle">no model call</text>
  <rect x="1645" y="21" width="55" height="17" rx="8.5" fill="#FEF9C3" stroke="#CA8A04"/>
  <text x="1672" y="33.5" font-size="9" font-weight="700" fill="#854D0E" text-anchor="middle">RAG</text>

  <!-- ============ stage cards, left to right ============ -->
  <!-- geometry: x0=40, card_w=232, gap=28, y0=64, card_h=470 -->

  <!-- connecting arrows between cards 1-2-3-4-5 (drawn first, under cards) -->
  <line x1="272" y1="299" x2="300" y2="299" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="532" y1="299" x2="560" y2="299" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="792" y1="299" x2="820" y2="299" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1052" y1="299" x2="1080" y2="299" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CARD 1 — Intake (client) -->
  <g>
    <rect x="40" y="64" width="232" height="470" rx="12" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
    <circle cx="63" cy="90" r="13" fill="#047857"/>
    <text x="63" y="94.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="84" y="95" font-size="14.5" font-weight="700" fill="#047857">Intake</text>
    <text x="60" y="122" font-size="10" font-weight="700" letter-spacing=".05em" fill="#059669">CLIENT</text>

    <text x="60" y="152" font-size="11.5" font-weight="600" fill="#1A1A1A">Upload device data</text>
    <text x="60" y="168" font-size="10" fill="#6B7280">name, purpose, description,</text>
    <text x="60" y="181" font-size="10" fill="#6B7280">clinical &amp; risk summary</text>

    <text x="60" y="212" font-size="11.5" font-weight="600" fill="#1A1A1A">Consent to audit trail</text>
    <text x="60" y="228" font-size="10" fill="#6B7280">fix 2 — required, or nothing</text>
    <text x="60" y="241" font-size="10" fill="#6B7280">is recorded at all</text>

    <text x="60" y="272" font-size="11.5" font-weight="600" fill="#1A1A1A">Set parameters</text>
    <text x="60" y="288" font-size="10" fill="#6B7280">regulation, device class,</text>
    <text x="60" y="301" font-size="10" fill="#6B7280">target market</text>

    <rect x="60" y="490" width="98" height="17" rx="8.5" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="109" y="502.5" font-size="9" font-weight="700" fill="#6B7280" text-anchor="middle">no model call</text>
  </g>

  <!-- CARD 2 — Screening / 4 gates (agent) -->
  <g>
    <rect x="300" y="64" width="232" height="470" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
    <circle cx="323" cy="90" r="13" fill="#6D28D9"/>
    <text x="323" y="94.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="344" y="95" font-size="14.5" font-weight="700" fill="#6D28D9">Screening</text>
    <text x="320" y="122" font-size="10" font-weight="700" letter-spacing=".05em" fill="#7C3AED">AGENT · 4 GATES</text>

    <circle cx="326" cy="146" r="4" fill="#9CA3AF"/>
    <text x="336" y="150" font-size="11" font-weight="600" fill="#1A1A1A">Consent check</text>
    <text x="336" y="164" font-size="9.5" fill="#6B7280">no model call</text>

    <circle cx="326" cy="188" r="4" fill="#1D4ED8"/>
    <text x="336" y="192" font-size="11" font-weight="600" fill="#1A1A1A">Scope check</text>
    <text x="336" y="206" font-size="9.5" fill="#6B7280">Claude · LLM-as-judge · iter. 1</text>

    <circle cx="326" cy="230" r="4" fill="#9CA3AF"/>
    <text x="336" y="234" font-size="11" font-weight="600" fill="#1A1A1A">Data quality check</text>
    <text x="336" y="248" font-size="9.5" fill="#6B7280">iter. 2 · &gt;15% missing pivotal-</text>
    <text x="336" y="260" font-size="9.5" fill="#6B7280">trial patient data (fix 3)</text>

    <circle cx="326" cy="282" r="4" fill="#1D4ED8"/>
    <text x="336" y="286" font-size="11" font-weight="600" fill="#1A1A1A">Classification check</text>
    <text x="336" y="300" font-size="9.5" fill="#6B7280">Claude · bug-hunt fix</text>

    <text x="320" y="336" font-size="10.5" font-weight="600" fill="#7C3AED">Any gate can decline —</text>
    <text x="320" y="350" font-size="10.5" font-weight="600" fill="#7C3AED">respectfully, before any</text>
    <text x="320" y="364" font-size="10.5" font-weight="600" fill="#7C3AED">drafting starts.</text>
  </g>

  <!-- CARD 3 — Drafting (agent) -->
  <g>
    <rect x="560" y="64" width="232" height="470" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
    <circle cx="583" cy="90" r="13" fill="#6D28D9"/>
    <text x="583" y="94.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="604" y="95" font-size="14.5" font-weight="700" fill="#6D28D9">Drafting</text>
    <text x="580" y="122" font-size="10" font-weight="700" letter-spacing=".05em" fill="#7C3AED">AGENT</text>

    <text x="580" y="152" font-size="11.5" font-weight="600" fill="#1A1A1A">Fetch EU MDR</text>
    <text x="580" y="168" font-size="10" fill="#6B7280">live from eumdr.com (fix 1)</text>
    <text x="580" y="181" font-size="10" fill="#6B7280">+ local Annex reference</text>
    <rect x="580" y="190" width="98" height="16" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="629" y="201.5" font-size="8.5" font-weight="700" fill="#6B7280" text-anchor="middle">no model call</text>
    <rect x="682" y="190" width="55" height="16" rx="8" fill="#FEF9C3" stroke="#CA8A04"/>
    <text x="709.5" y="201.5" font-size="8.5" font-weight="700" fill="#854D0E" text-anchor="middle">RAG</text>
    <text x="580" y="219" font-size="9" fill="#854D0E">retrieved text grounds every draft ↓</text>

    <text x="580" y="248" font-size="11.5" font-weight="600" fill="#1A1A1A">Draft 6 sections</text>
    <text x="580" y="264" font-size="10" fill="#6B7280">one per fixed GSPR clause,</text>
    <text x="580" y="277" font-size="10" fill="#6B7280">in parallel</text>
    <rect x="580" y="286" width="94" height="16" rx="8" fill="#DBEAFE" stroke="#1D4ED8"/>
    <text x="627" y="297.5" font-size="8.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Claude ×6</text>

    <text x="580" y="330" font-size="11.5" font-weight="600" fill="#1A1A1A">Export to Word</text>
    <text x="580" y="346" font-size="10" fill="#6B7280">.docx, python-docx</text>
    <rect x="580" y="355" width="98" height="16" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="629" y="366.5" font-size="8.5" font-weight="700" fill="#6B7280" text-anchor="middle">no model call</text>
  </g>

  <!-- CARD 4 — Compliance check (agent) -->
  <g>
    <rect x="820" y="64" width="232" height="470" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
    <circle cx="843" cy="90" r="13" fill="#6D28D9"/>
    <text x="843" y="94.5" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="864" y="95" font-size="14.5" font-weight="700" fill="#6D28D9">Compliance check</text>
    <text x="840" y="122" font-size="10" font-weight="700" letter-spacing=".05em" fill="#7C3AED">AGENT · LLM-AS-JUDGE</text>

    <text x="840" y="154" font-size="11.5" font-weight="600" fill="#1A1A1A">Score every section</text>
    <text x="840" y="170" font-size="10" fill="#6B7280">pass / fail against a fixed</text>
    <text x="840" y="183" font-size="10" fill="#6B7280">rubric, before any human</text>
    <text x="840" y="196" font-size="10" fill="#6B7280">sees the draft</text>
    <rect x="840" y="206" width="180" height="16" rx="8" fill="#DBEAFE" stroke="#1D4ED8"/>
    <text x="930" y="217.5" font-size="8.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Claude ×6 · parallel (bug-hunt fix)</text>

    <text x="840" y="252" font-size="11.5" font-weight="600" fill="#1A1A1A">Redraft what's flagged</text>
    <text x="840" y="268" font-size="10" fill="#6B7280">only the failing section —</text>
    <text x="840" y="281" font-size="10" fill="#6B7280">not the whole document</text>
  </g>

  <line x1="1052" y1="299" x2="1080" y2="299" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CARD 5 — Review loop (expert + client, split) -->
  <g>
    <rect x="1080" y="64" width="232" height="470" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="1096" y="90" font-size="14.5" font-weight="700" fill="#1A1A1A">5 · Review loop</text>

    <!-- expert sub-band -->
    <rect x="1096" y="104" width="200" height="118" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
    <circle cx="1114" cy="126" r="4" fill="#B91C1C"/>
    <text x="1124" y="130" font-size="10" font-weight="700" letter-spacing=".04em" fill="#B91C1C">REGULATORY EXPERT</text>
    <text x="1112" y="152" font-size="11" font-weight="600" fill="#1A1A1A">Internal QA — one pass</text>
    <text x="1112" y="168" font-size="9.5" fill="#6B7280">draft → feedback → agent</text>
    <text x="1112" y="180" font-size="9.5" fill="#6B7280">revises → expert validates</text>
    <rect x="1112" y="192" width="168" height="16" rx="8" fill="#DBEAFE" stroke="#1D4ED8"/>
    <text x="1196" y="203.5" font-size="8.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Claude call per round</text>

    <!-- client sub-band -->
    <rect x="1096" y="234" width="200" height="278" rx="8" fill="#ECFDF5" stroke="#6EE7B7"/>
    <circle cx="1114" cy="256" r="4" fill="#047857"/>
    <text x="1124" y="260" font-size="10" font-weight="700" letter-spacing=".04em" fill="#047857">CLIENT</text>
    <text x="1112" y="282" font-size="11" font-weight="600" fill="#1A1A1A">Client review — up to 5 rounds</text>
    <text x="1112" y="300" font-size="9.5" fill="#6B7280">ship → request feedback →</text>
    <text x="1112" y="313" font-size="9.5" fill="#6B7280">client responds → agent</text>
    <text x="1112" y="326" font-size="9.5" fill="#6B7280">updates</text>
    <rect x="1112" y="336" width="168" height="16" rx="8" fill="#DBEAFE" stroke="#1D4ED8"/>
    <text x="1196" y="347.5" font-size="8.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Claude call per round</text>

    <path d="M 1280 372 A 20 20 0 1 1 1279 371" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="1112" y="400" font-size="9.5" font-weight="700" fill="#059669">↻ repeats until accepted,</text>
    <text x="1112" y="414" font-size="9.5" font-weight="700" fill="#059669">or the round cap is hit</text>

    <rect x="1112" y="430" width="168" height="16" rx="8" fill="#047857"/>
    <text x="1196" y="441.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">×5 rounds, max</text>
  </g>

  <!-- ============ STEP 6 — fork into two outcomes ============ -->
  <text x="1420" y="90" font-size="14.5" font-weight="700" fill="#1A1A1A">6 · Final decision</text>
  <text x="1420" y="110" font-size="10" fill="#6B7280">at round 5, or earlier if satisfied</text>
  <rect x="1420" y="118" width="98" height="16" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="1469" y="129.5" font-size="8.5" font-weight="700" fill="#6B7280" text-anchor="middle">no model call</text>

  <!-- forking arrows: one path per outcome, diverging right out of card 5 -->
  <path d="M 1312 299 C 1350 299, 1350 235, 1418 220" fill="none" stroke="#059669" stroke-width="2.25" marker-end="url(#arrowGreen)"/>
  <path d="M 1312 299 C 1350 299, 1350 385, 1418 406" fill="none" stroke="#DC2626" stroke-width="2.25" marker-end="url(#arrowRed)"/>

  <rect x="1420" y="150" width="260" height="160" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="1438" y="178" font-size="13" font-weight="700" fill="#047857">✓ Client accepts</text>
  <text x="1438" y="202" font-size="10.5" fill="#6B7280">Agent ships the final</text>
  <text x="1438" y="217" font-size="10.5" fill="#6B7280">CE-mark submission</text>
  <text x="1438" y="232" font-size="10.5" fill="#6B7280">package.</text>
  <text x="1438" y="256" font-size="10.5" font-weight="700" fill="#047857">Loop closed.</text>

  <rect x="1420" y="326" width="260" height="160" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="1438" y="354" font-size="13" font-weight="700" fill="#B91C1C">✕ Client declines</text>
  <text x="1438" y="378" font-size="10.5" fill="#6B7280">Agent offers to schedule</text>
  <text x="1438" y="393" font-size="10.5" fill="#6B7280">a live meeting with the</text>
  <text x="1438" y="408" font-size="10.5" fill="#6B7280">regulatory expert.</text>
  <text x="1438" y="432" font-size="10.5" font-weight="700" fill="#B91C1C">Never a dead end.</text>

  <!-- Caption -->
  <text x="40" y="670" font-size="11.5" fill="#4B5563">Every Claude call — scope, classification, drafting, the compliance gate, every review-round redraft — is routed through one shared module,</text>
  <text x="40" y="688" font-size="11.5" fill="#4B5563">which converts a persistent API failure into one clear error instead of a raw exception (bug-hunt fix). RAG = retrieval-augmented generation.</text>
</svg>
