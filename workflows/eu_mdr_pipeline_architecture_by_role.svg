<svg viewBox="0 0 1040 1200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">EU MDR Agentic Workflow — Technical Pipeline (by role)</title>
  <desc id="desc">Eight pipeline stages run in fixed order, colored by who acts at each stage: client, agent, or regulatory expert, matching the workflow overview diagram. Stage 2 retrieves the EU MDR regulation text (RAG) and that same text is reused as grounding in stages 3, 6 and 7. Every model call, in stages 3, 4, 6 and 7, is routed through one shared call point. Stages 1, 5 and 8 involve no model call at all.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1200" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="32" font-size="19" font-weight="700" fill="#1A1A1A">EU MDR Agentic Workflow — Technical Pipeline</text>
  <text x="40" y="52" font-size="12" fill="#6B7280">The same eight stages, colored by who acts at each one — client, agent, or regulatory expert — matching the workflow overview.</text>

  <!-- Legend row 1: role (matches workflow overview diagram) -->
  <circle cx="46" cy="76" r="5" fill="#047857"/>
  <text x="58" y="80" font-size="11" font-weight="700" fill="#047857">Client</text>
  <circle cx="200" cy="76" r="5" fill="#C2410C"/>
  <text x="212" y="80" font-size="11" font-weight="700" fill="#C2410C">Agent</text>
  <circle cx="340" cy="76" r="5" fill="#B91C1C"/>
  <text x="352" y="80" font-size="11" font-weight="700" fill="#B91C1C">Regulatory Expert</text>

  <!-- Legend row 2: mechanism -->
  <circle cx="46" cy="98" r="5" fill="#C2410C" opacity="0.55"/>
  <text x="58" y="102" font-size="10.5" font-weight="700" fill="#9A6A4E">RAG retrieval</text>
  <circle cx="200" cy="98" r="5" fill="#1D4ED8"/>
  <text x="212" y="102" font-size="10.5" font-weight="700" fill="#1D4ED8">Claude call</text>
  <circle cx="340" cy="98" r="5" fill="#9CA3AF"/>
  <text x="352" y="102" font-size="10.5" font-weight="700" fill="#6B7280">no model call</text>

  <!-- ============ SPINE ============ -->
  <!-- S1 client uploads + sets parameters -->
  <rect x="40" y="126" width="560" height="70" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <rect x="480" y="138" width="108" height="20" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="534" y="152" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="middle">no model call</text>
  <text x="58" y="154" font-size="13.5" font-weight="700" fill="#047857">① Client uploads data &amp; sets parameters</text>
  <text x="58" y="176" font-size="11.5" fill="#6B7280">Device data and chosen parameters (EU MDR, device class, market) load as plain structured objects.</text>

  <line x1="320" y1="196" x2="320" y2="222" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="332" y="213" font-size="10" fill="#9CA3AF">device data + params</text>

  <!-- S2 agent fetches the regulation (RAG) -->
  <rect x="40" y="222" width="560" height="100" rx="10" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.75"/>
  <rect x="452" y="234" width="136" height="20" rx="10" fill="#FFEDD5" stroke="#C2410C"/>
  <text x="520" y="248" font-size="9.5" font-weight="700" fill="#C2410C" text-anchor="middle">RAG retrieval</text>
  <text x="58" y="250" font-size="13.5" font-weight="700" fill="#C2410C">② Agent fetches the regulation</text>
  <text x="58" y="272" font-size="11.5" fill="#6B7280">Retrieves the actual EU MDR Annex I/II/III/XIV text before any</text>
  <text x="58" y="288" font-size="11.5" fill="#6B7280">drafting happens — grounding, not the model's memory of MDR.</text>
  <text x="58" y="308" font-size="10" fill="#9CA3AF">Local reference file by default; a live-fetch option attempts the live source.</text>

  <line x1="320" y1="322" x2="320" y2="348" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="332" y="339" font-size="10" fill="#9CA3AF">regulation text</text>

  <!-- S3 agent drafts the submission -->
  <rect x="40" y="348" width="560" height="92" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <rect x="446" y="360" width="142" height="20" rx="10" fill="#DBEAFE" stroke="#1D4ED8"/>
  <text x="517" y="374" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Claude call ×6</text>
  <text x="58" y="376" font-size="13.5" font-weight="700" fill="#C2410C">③ Agent drafts the submission (parallel)</text>
  <text x="58" y="398" font-size="11.5" fill="#6B7280">One call per fixed MDR section, run concurrently, each</text>
  <text x="58" y="414" font-size="11.5" fill="#6B7280">prompted with the regulation text retrieved in step 2.</text>

  <line x1="320" y1="440" x2="320" y2="466" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="332" y="457" font-size="10" fill="#9CA3AF">6 draft sections</text>

  <!-- S4 automated compliance gate -->
  <rect x="40" y="466" width="560" height="92" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <rect x="404" y="478" width="184" height="20" rx="10" fill="#DBEAFE" stroke="#1D4ED8"/>
  <text x="496" y="492" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Claude call ×6 · LLM-as-judge</text>
  <text x="58" y="494" font-size="13.5" font-weight="700" fill="#C2410C">④ Automated compliance gate</text>
  <text x="58" y="516" font-size="11.5" fill="#6B7280">A second call scores each section pass/fail against a fixed</text>
  <text x="58" y="532" font-size="11.5" fill="#6B7280">rubric; a FAIL redrafts only that section, before any human sees it.</text>

  <line x1="320" y1="558" x2="320" y2="584" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="332" y="575" font-size="10" fill="#9CA3AF">pass/fail + revised sections</text>

  <!-- S5 agent exports to Word -->
  <rect x="40" y="584" width="560" height="70" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <rect x="480" y="596" width="108" height="20" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="534" y="610" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="middle">no model call</text>
  <text x="58" y="612" font-size="13.5" font-weight="700" fill="#C2410C">⑤ Agent exports to Word</text>
  <text x="58" y="634" font-size="11.5" fill="#6B7280">Sections are assembled into the first draft document.</text>

  <line x1="320" y1="654" x2="320" y2="680" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="332" y="671" font-size="10" fill="#9CA3AF">draft document</text>

  <!-- S6 internal expert review -->
  <rect x="40" y="680" width="560" height="92" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <rect x="424" y="692" width="164" height="20" rx="10" fill="#DBEAFE" stroke="#1D4ED8"/>
  <text x="506" y="706" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Claude call per round</text>
  <text x="58" y="708" font-size="13.5" font-weight="700" fill="#B91C1C">⑥ Internal expert review</text>
  <text x="58" y="730" font-size="11.5" fill="#6B7280">The expert's written feedback drives a redraft call, grounded</text>
  <text x="58" y="746" font-size="11.5" fill="#6B7280">in the same regulation text, repeated until they approve.</text>

  <line x1="320" y1="772" x2="320" y2="798" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="332" y="789" font-size="10" fill="#9CA3AF">expert-validated document</text>

  <!-- S7 client review loop -->
  <rect x="40" y="798" width="560" height="98" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="424" y="810" width="164" height="20" rx="10" fill="#DBEAFE" stroke="#1D4ED8"/>
  <text x="506" y="824" font-size="9.5" font-weight="700" fill="#1D4ED8" text-anchor="middle">Claude call per round</text>
  <rect x="494" y="834" width="94" height="20" rx="10" fill="#047857"/>
  <text x="541" y="848" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">×5 rounds max</text>
  <text x="58" y="826" font-size="13.5" font-weight="700" fill="#047857">⑦ Client review loop</text>
  <text x="58" y="848" font-size="11.5" fill="#6B7280">Same pattern with the client: ship, collect feedback, redraft —</text>
  <text x="58" y="864" font-size="11.5" fill="#6B7280">up to 5 rounds, fewer if the client approves early.</text>

  <line x1="320" y1="896" x2="320" y2="922" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="332" y="913" font-size="10" fill="#9CA3AF">round cap reached, no approval</text>

  <!-- S8 agent asks for final approval -->
  <rect x="40" y="922" width="560" height="80" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <rect x="480" y="934" width="108" height="20" rx="10" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="534" y="948" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="middle">no model call</text>
  <text x="58" y="950" font-size="13.5" font-weight="700" fill="#C2410C">⑧ Agent asks for final approval</text>
  <text x="58" y="972" font-size="11.5" fill="#6B7280">Round 5 with no approval forces an accept/decline choice.</text>
  <text x="58" y="988" font-size="11.5" fill="#6B7280">A plain text branch — the client's word decides, not a model.</text>

  <!-- branch to outcomes -->
  <line x1="320" y1="1002" x2="320" y2="1020" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="320" y1="1020" x2="180" y2="1020" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="320" y1="1020" x2="460" y2="1020" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="180" y1="1020" x2="180" y2="1032" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="1020" x2="460" y2="1032" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="1032" width="280" height="80" rx="10" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="58" y="1058" font-size="13" font-weight="700" fill="#047857">Client accepts</text>
  <text x="58" y="1078" font-size="11" fill="#6B7280">Agent ships the final package —</text>
  <text x="58" y="1092" font-size="11" fill="#6B7280">loop closed.</text>

  <rect x="320" y="1032" width="280" height="80" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="338" y="1058" font-size="13" font-weight="700" fill="#B91C1C">Client declines</text>
  <text x="338" y="1078" font-size="11" fill="#6B7280">Agent offers to schedule a call</text>
  <text x="338" y="1092" font-size="11" fill="#6B7280">with the regulatory expert.</text>

  <!-- ============ RAIL: regulation text (RAG), reused as grounding ============ -->
  <text x="700" y="216" font-size="10" font-weight="700" fill="#C2410C">regulation text</text>
  <text x="700" y="229" font-size="9.5" fill="#B45309">(RAG-retrieved once,</text>
  <text x="700" y="241" font-size="9.5" fill="#B45309">reused as grounding)</text>

  <line x1="600" y1="272" x2="700" y2="272" stroke="#C2410C" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="700" y1="272" x2="700" y2="851" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="700" y1="394" x2="600" y2="394" stroke="#C2410C" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="700" y1="726" x2="600" y2="726" stroke="#C2410C" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <line x1="700" y1="851" x2="600" y2="851" stroke="#C2410C" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- ============ RAIL: the one shared point every model call passes through ============ -->
  <rect x="830" y="318" width="90" height="30" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="875" y="337" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">Claude</text>
  <text x="826" y="294" font-size="9.5" fill="#1D4ED8" text-anchor="middle">routes through</text>
  <text x="826" y="306" font-size="9.5" fill="#1D4ED8" text-anchor="middle">one shared call point</text>

  <line x1="875" y1="348" x2="875" y2="867" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="875" y1="410" x2="600" y2="410" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="875" y1="528" x2="600" y2="528" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="875" y1="742" x2="600" y2="742" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="875" y1="867" x2="600" y2="867" stroke="#1D4ED8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Caption -->
  <text x="40" y="1150" font-size="11.5" fill="#4B5563">The regulation text is fetched once (RAG, step ②) and reused as grounding wherever a section is written or</text>
  <text x="40" y="1166" font-size="11.5" fill="#4B5563">rewritten (③⑥⑦) — the automated gate (④) checks against a fixed rubric instead, not the regulation text directly.</text>
  <text x="40" y="1182" font-size="11.5" fill="#4B5563">Every model call in the whole pipeline, without exception, is routed through one shared call point.</text>
</svg>
